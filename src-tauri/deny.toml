[graph]
targets = []
all-features = false
no-default-features = false

[advisories]
unmaintained = "all"
ignore = [
  # GTK3 bindings — unmaintained upstream, pulled in by Tauri on Linux.
  # Tauri 2.x depends on gtk3-rs; migration to gtk4-rs is a Tauri upstream task.
  "RUSTSEC-2024-0370",  # gtk3-macros
  "RUSTSEC-2024-0411",  # gdk
  "RUSTSEC-2024-0412",  # gdk-sys
  "RUSTSEC-2024-0413",  # atk
  "RUSTSEC-2024-0414",  # gdk-pixbuf
  "RUSTSEC-2024-0415",  # gdk-pixbuf-sys
  "RUSTSEC-2024-0416",  # atk-sys
  "RUSTSEC-2024-0417",  # gdkx11
  "RUSTSEC-2024-0418",  # gdkx11-sys
  "RUSTSEC-2024-0419",  # gtk
  "RUSTSEC-2024-0420",  # gtk-sys
  # Transitive deps of Tauri — no direct fix available
  "RUSTSEC-2025-0057",  # fxhash (via selectors → kuchikiki → tauri-utils)
  "RUSTSEC-2025-0075",  # unic-char-range (via urlpattern → tauri-utils)
  "RUSTSEC-2025-0080",  # unic-common (via urlpattern → tauri-utils)
  "RUSTSEC-2025-0081",  # unic-char-property (via urlpattern → tauri-utils)
  "RUSTSEC-2025-0098",  # glib (via gtk → tauri)
  "RUSTSEC-2025-0100",  # gobject-sys (via glib → gtk → tauri)
  # quick-xml (via plist → tauri) — macOS-only dep; no fix available yet
  "RUSTSEC-2026-0194",  # quadratic attribute-duplicate-check in BytesStart
  "RUSTSEC-2026-0195",  # unbounded namespace allocation in NsReader
]

[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-2-Clause",
  "BSD-3-Clause",
  "MPL-2.0",
  "Unicode-3.0",
  "Zlib",
  # Added with reqwest 0.12 / oauth2 5.0 (ring, rustls-webpki, untrusted):
  "ISC",
  # Added with reqwest 0.12 / oauth2 5.0 (webpki-roots):
  "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
exceptions = []

[bans]
multiple-versions = "deny"
wildcards = "allow"
# All known duplicate versions originate from Tauri's transitive dependency
# tree (36 crates, 80+ versions). We cannot control these — they're managed
# by the Tauri framework. Review when upgrading Tauri to a new major version.
skip-tree = [
  { name = "tauri", version = ">=2" },
  { name = "tauri-build", version = ">=2" },
  { name = "tauri-plugin-log", version = ">=2" },
]

[sources]
unknown-registry = "warn"
unknown-git = "warn"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
